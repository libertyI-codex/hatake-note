<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="4×4の畑と作付け期間をシンプルに管理するローカルWebアプリ"
    />
    <title>畑ノート Ver.2.0 試作2</title>
    <link rel="stylesheet" href="style.css?v=20p2" />
    <script src="data.js?v=20p2" defer></script>
    <script src="app.js?v=20p2" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div>
          <p class="app-version">Ver.2.0 試作2</p>
          <h1>畑ノート</h1>
        </div>
      </header>

      <main id="app" class="app-main" tabindex="-1"></main>

      <nav class="bottom-nav" aria-label="メインメニュー">
        <button type="button" class="nav-button is-active" data-route="field">
          <span class="nav-icon" aria-hidden="true">田</span>
          <span>畑</span>
        </button>
        <button type="button" class="nav-button" data-route="year">
          <span class="nav-icon" aria-hidden="true">暦</span>
          <span>年間予定</span>
        </button>
        <button type="button" class="nav-button" data-route="data">
          <span class="nav-icon" aria-hidden="true">保</span>
          <span>データ</span>
        </button>
      </nav>
    </div>

    <dialog id="app-dialog" class="app-dialog">
      <div id="dialog-content"></div>
    </dialog>

    <div
      id="toast"
      class="toast"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>
  </body>
</html>
